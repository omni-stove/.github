name: Agent Fix

# CI の失敗とレビュー指摘をコーディングエージェントに直させ、PR の head に 1 コミット積む reusable workflow。
# ci.yml / ci-gate.yml の fix ジョブが、actions/decide-fix の判定 (起動可否ときっかけ) を受けて呼ぶ。
#
# エージェントは依存を入れず、テストも走らせない。渡すのは actions/fix-context が集めた CI 失敗ログ・
# PR の背景・未解決のレビュー指摘とコードだけで、push 後に走る次の CI が修正の検証になる。
# commit / base のマージ / push / コメント投稿は決定論的に step が行う。
#
# 修正の前に checkout 済みの base を head にマージし、コンフリクトしたらエージェントにマーカーだけを解消させてマージ
# コミットにする (actions/base-merge)。修正のエージェントは解消したマージの上で動き、自動修正コミットはその上に積む。
# 解消を修正と別のエージェントにさせるのは、マージコミットに解消以外を混ぜないため。
#
# lockfile / 生成物はエージェントに作り直させない。CI の lint / test などのジョブが actions/regen-diff で作り直し、
# CI Gate がその差分を積む (ci-gate.yml)。その run では自動修正を起動しないので、ここには届かない。
#
# push は agent App のトークンで行う。github.token の push では次の CI が起動しないため。
# 自動修正コミットが人間のコミットを挟まず max-consecutive 回続いたら止めて PR で知らせる。

on:
  workflow_call:
    inputs:
      pr-number:
        description: 対象 PR 番号
        type: string
        required: true
      ref:
        description: fix を push する PR の head ブランチ
        type: string
        required: true
      trigger:
        description: 修正のきっかけ (ci | review)
        type: string
        required: true
      fix-review-comments:
        description: レビュー指摘も修正対象にするか。'false' なら trigger=ci でも lint / test の失敗だけを直す
        type: string
        default: "true"
      workflow-run-id:
        description: trigger=ci のとき、失敗ログを引く CI run の ID
        type: string
        default: ""
      provider:
        description: 実行する provider (claude | codex)
        type: string
        default: "claude"
      tier:
        description: モデルの tier (max | high | medium | low)
        type: string
        default: "medium"
      model:
        description: モデルを直接指定する (空なら tier から解決する)
        type: string
        default: ""
      effort:
        description: 推論 effort (low | medium | high | xhigh | max)。空なら provider の既定値
        type: string
        default: ""
      max-turns:
        description: エージェントの最大ターン数 (--max-turns)
        type: string
        default: "40"
      allowed-bots:
        description: bot が起こした run でもエージェントを走らせる bot 名 (カンマ区切り。'*' で全て)
        type: string
        default: "*"
      instructions:
        description: 修正指示に追記する文 (リポジトリ固有の規約や注意点)
        type: string
        default: ""
      max-consecutive:
        description: 人間のコミットを挟まずに自動修正を続ける上限
        type: string
        default: "3"
      regen-command:
        description: 使わない。渡している呼び出し側を壊さないよう受け取るだけ (作り直しは CI の actions/regen-diff が担う)
        type: string
        default: ""
      node-version:
        description: 使わない。渡している呼び出し側を壊さないよう受け取るだけ
        type: string
        default: "24"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      AGENT_GH_APP_ID:
        required: false
      AGENT_GH_APP_PRIVATE_KEY:
        required: false

# 同じブランチへの fix の push を直列化する。
concurrency:
  group: agent-fix-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  fix:
    name: Agent Fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # permissions を書かず呼び出し側のものを引き継ぐ (失敗ログの取得に actions: read、コメントに
    # pull-requests / issues: write、エージェントに id-token: write)。書くと、actions: read を渡していない
    # 呼び出し側が読み込み時に権限超過で落ちる。push は agent App のトークンで行うので contents: write は要らない。
    steps:
      - name: Generate agent App token
        id: app
        uses: omni-stove/.github/actions/github-app-token@main
        with:
          app-id: ${{ secrets.AGENT_GH_APP_ID }}
          private-key: ${{ secrets.AGENT_GH_APP_PRIVATE_KEY }}

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          # push 前の base のマージに共通祖先が要り、ループ防止は base のマージコミットを挟んで遡るため全履歴を取る。
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          # エージェントが作業ツリーの .git/config から書き込みトークンを読めないよう残さない。push は push-agent-fix が渡す。
          persist-credentials: false

      - name: Collect fix context
        id: context
        uses: omni-stove/.github/actions/fix-context@main
        with:
          pr-number: ${{ inputs.pr-number }}
          trigger: ${{ inputs.trigger }}
          fix-review-comments: ${{ inputs.fix-review-comments }}
          workflow-run-id: ${{ inputs.workflow-run-id }}
          bot-login: ${{ steps.app.outputs.app-slug }}
          max-consecutive: ${{ inputs.max-consecutive }}
          github-token: ${{ steps.app.outputs.token }}

      - name: Merge the base
        id: merge
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.run == 'true'
        uses: omni-stove/.github/actions/base-merge@main
        with:
          mode: start
          pr-number: ${{ inputs.pr-number }}
          ref: ${{ inputs.ref }}
          github-token: ${{ steps.app.outputs.token }}
          git-user-name: ${{ steps.app.outputs.bot-login }}
          git-user-email: ${{ format('{0}@users.noreply.github.com', steps.app.outputs.bot-login) }}

      - name: Resolve base conflicts
        id: resolve
        if: steps.merge.outputs.result == 'conflicted'
        uses: omni-stove/.github/actions/agent-run@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          provider: ${{ inputs.provider }}
          tier: ${{ inputs.tier }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          allowed-bots: ${{ inputs.allowed-bots }}
          extra-claude-args: "--max-turns ${{ inputs.max-turns }}"
          rate-limit-retry-max-wait-seconds: "900"
          allowed-tools: "Read,Edit,Write,NotebookEdit,Glob,Grep"
          disallowed-tools: "Bash,WebFetch,WebSearch,Task,Agent,Skill"
          permission-profile: workspace-write
          system-prompt: "Always output in Japanese."
          json-schema: '{"type":"object","required":["summary"],"additionalProperties":false,"properties":{"summary":{"type":"string","description":"ファイルごとに、どちらの変更をどう残したかを書く。1 行目は解消の要約。解消しきれなかったマーカーがあればその場所と理由を書く。"}}}'
          prompt: |
            Merging the base branch `${{ steps.merge.outputs.base }}` into this pull request's branch `${{ inputs.ref }}` conflicted.
            Resolve the conflict markers (`<<<<<<<`, `=======`, `>>>>>>>`) in these files, and edit nothing else:

            ```
            ${{ steps.merge.outputs.files }}
            ```

            In each conflicted hunk, the side marked HEAD is this pull request and the other side is the base.
            Keep the intent of both: keep the base's changes and reapply this pull request's change on top of them.
            Where the two cannot both hold, follow the base and say so in `summary`. Delete a file only when the base
            deleted it and this pull request's change no longer applies.

            ${{ steps.context.outputs.pr-context }}

            Read the AGENTS.md or CLAUDE.md nearest to each file you edit and follow it.

            Do not run tests or try to validate; dependencies are not installed in this job.
            Edit files and stop there; a later step commits the merge.

      - name: Commit the resolved merge
        id: resolved
        if: steps.resolve.outcome == 'success'
        uses: omni-stove/.github/actions/base-merge@main
        with:
          mode: finish
          base: ${{ steps.merge.outputs.base }}
          ref: ${{ inputs.ref }}
          base-sha: ${{ steps.merge.outputs.base-sha }}
          tree: ${{ steps.merge.outputs.tree }}
          files: ${{ steps.merge.outputs.files }}
          git-user-name: ${{ steps.app.outputs.bot-login }}
          git-user-email: ${{ format('{0}@users.noreply.github.com', steps.app.outputs.bot-login) }}

      # 解消できなかった (しない) コンフリクトの上に直しても push でまたコンフリクトするので、修正のエージェントを走らせない。
      - name: Run agent fix
        id: agent
        if: >-
          steps.context.outputs.skip != 'true' && steps.context.outputs.run == 'true'
          && (steps.merge.outputs.result != 'conflicted' || steps.resolved.outputs.result == 'resolved')
          && steps.merge.outputs.result != 'unresolvable'
        uses: omni-stove/.github/actions/agent-run@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          provider: ${{ inputs.provider }}
          tier: ${{ inputs.tier }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          allowed-bots: ${{ inputs.allowed-bots }}
          extra-claude-args: "--max-turns ${{ inputs.max-turns }}"
          # App のレート制限は他の workflow と共有で枯渇しやすいので、timeout-minutes に収まる 15 分まで待つ。
          rate-limit-retry-max-wait-seconds: "900"
          allowed-tools: "Read,Edit,Write,NotebookEdit,Glob,Grep"
          disallowed-tools: "Bash,WebFetch,WebSearch,Task,Agent,Skill"
          permission-profile: workspace-write
          system-prompt: "Always output in Japanese."
          json-schema: '{"type":"object","description":"テスト・lint を実行していないことや検証していないことには触れない。","required":["summary","replies","blocked_by_external"],"additionalProperties":false,"properties":{"blocked_by_external":{"type":"boolean","description":"lint/test 失敗の原因が PR の差分外 (既定ブランチや別ブランチ) にあり、この PR では直せないなら true。その失敗は編集せず、原因を summary に書く。判断できないなら false。"},"summary":{"type":"string","description":"したことだけを書く。1 行目はコミット件名になる。見送った指摘はその根拠、修正不要ならその旨を書く。"},"replies":{"type":"array","description":"レビュー指摘ごとの対応内容。該当なしなら空配列。","items":{"type":"object","required":["comment_id","note"],"additionalProperties":false,"properties":{"comment_id":{"type":"integer","description":"返信先。指摘の見出しにある [comment_id=N] の N。"},"note":{"type":"string","description":"その指摘に対して何をしたか。直さなかったならその理由。"}}}}}}'
          prompt: |
            Fix what is reported below, and nothing else.

            ${{ steps.context.outputs.pr-context }}

            ${{ steps.context.outputs.ci-failure }}

            ${{ steps.context.outputs.review-comments }}

            Read the AGENTS.md or CLAUDE.md nearest to each file you edit and follow it.

            ${{ inputs.instructions }}

            Fix the root cause with the smallest change that holds, leaving a test's assertions and unrelated code as they are. Leave lockfiles and generated files to their generators.

            A failing lint or test still needs a fix whatever the discussion settled, unless the log shows the runner rather than the code gave way.

            Add a `replies` entry for each review comment you addressed or deliberately skipped.

            Work from the reports above; they are the whole input. No tool retrieves logs,
            diffs, or PR data. Where they fall short, say so in `summary` and fix what they cover.

            Do not run tests or try to validate; dependencies are not installed in this job.
            Edit files and stop there; a later step commits, merges the base, pushes, and comments on the PR.
            ${{ steps.resolved.outputs.result == 'resolved' && 'The base is already merged into the working tree; its conflicts were resolved in an earlier step.' || '' }}

      # 直せない失敗に push すると CI → fix が空回りするため、push せず人間に委ねる。
      - name: Check external give-up
        id: external
        if: steps.agent.outcome == 'success' && inputs.trigger == 'ci'
        env:
          STRUCTURED: ${{ steps.agent.outputs.structured-output }}
        run: |
          blocked="$(printf '%s' "$STRUCTURED" | jq -r '.blocked_by_external == true' 2>/dev/null || echo false)"
          echo "give_up=${blocked}" >> "$GITHUB_OUTPUT"

      - name: Commit and push the fix
        id: push
        if: steps.agent.outcome == 'success' && steps.external.outputs.give_up != 'true'
        uses: omni-stove/.github/actions/push-agent-fix@main
        with:
          ref: ${{ inputs.ref }}
          pr-number: ${{ inputs.pr-number }}
          resolved-merge: ${{ steps.resolved.outputs.merge-sha }}
          structured: ${{ steps.agent.outputs.structured-output }}
          github-token: ${{ steps.app.outputs.token }}
          git-user-name: ${{ steps.app.outputs.bot-login }}
          git-user-email: ${{ format('{0}@users.noreply.github.com', steps.app.outputs.bot-login) }}

      # エージェントが落ちても (push まで届かず result が空) 何が起きたか PR に残す。
      - name: Post fix result
        if: >-
          !cancelled()
          && steps.app.outcome == 'success'
          && (steps.context.outputs.skip == 'true' || steps.context.outputs.run == 'true')
        uses: omni-stove/.github/actions/post-fix-result@main
        with:
          pr-number: ${{ inputs.pr-number }}
          result: >-
            ${{ steps.context.outputs.skip == 'true' && 'loop'
            || steps.merge.outputs.result == 'conflicted' && steps.resolved.outputs.result != 'resolved' && 'unresolved'
            || steps.merge.outputs.result == 'unresolvable' && 'unresolved'
            || steps.external.outputs.give_up == 'true' && 'external'
            || steps.push.outputs.result }}
          structured: ${{ steps.agent.outputs.structured-output || steps.resolve.outputs.structured-output }}
          resolved-files: ${{ steps.push.outputs.result == 'pushed' && steps.merge.outputs.files || '' }}
          ref: ${{ inputs.ref }}
          max-consecutive: ${{ inputs.max-consecutive }}
          rate-limited: ${{ steps.agent.outputs.rate-limited }}
          rate-limit-reset: ${{ steps.agent.outputs.rate-limit-reset }}
          github-token: ${{ steps.app.outputs.token }}
