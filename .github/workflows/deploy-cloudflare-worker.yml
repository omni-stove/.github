name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      app-name:
        description: デプロイするアプリ名 (ジョブ名に表示する)
        type: string
        required: true
      working-directory:
        description: deploy-command を実行するディレクトリ
        type: string
        required: true
      node-version:
        description: Node.js のバージョン
        type: string
        default: "24"
      deploy-command:
        description: デプロイコマンド
        type: string
        default: "pnpm release"
      install-filter:
        description: pnpm install --filter の値 (空なら全パッケージ)
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.app-name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm & Node.js
        uses: omni-stove/.github/actions/setup-pnpm-node@main
        with:
          node-version: ${{ inputs.node-version }}
          install-filter: ${{ inputs.install-filter }}

      - name: Deploy to Cloudflare Workers
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.deploy-command }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
