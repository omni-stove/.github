name: Agent Run

# コーディングエージェントに prompt を渡して実行する reusable workflow。
# provider (claude | codex) は入力で切り替えられる (actions/agent-run)。
# main への直接 push は settings の deny で禁止する。

on:
  workflow_call:
    inputs:
      prompt:
        type: string
        required: true
      provider:
        description: 実行する provider (claude | codex)
        type: string
        default: "claude"
      tier:
        description: モデルの tier (max | high | medium | low)
        type: string
        default: "high"
      model:
        description: モデルを直接指定する (空なら tier から解決する)
        type: string
        default: ""
      effort:
        description: 推論 effort (low | medium | high | xhigh | max)。空なら provider の既定値
        type: string
        default: ""
      allowed-tools:
        type: string
        default: "Edit,Write,Read,Bash"
      permission-profile:
        description: read-only | workspace-write | danger-full-access (空なら allowed-tools から推定)
        type: string
        default: ""
      show-full-output:
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: omni-stove/.github/actions/agent-run@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ github.token }}
        with:
          provider: ${{ inputs.provider }}
          tier: ${{ inputs.tier }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          allowed-tools: ${{ inputs.allowed-tools }}
          permission-profile: ${{ inputs.permission-profile }}
          show-full-output: ${{ inputs.show-full-output }}
          settings: |
            {
              "permissions": {
                "deny": ["Bash(git push * main)", "Bash(git push * main:*)", "Bash(git push origin main)", "Bash(git push origin main:*)"]
              }
            }
          prompt: ${{ inputs.prompt }}
