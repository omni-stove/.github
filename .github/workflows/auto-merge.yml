name: Auto Merge

on:
  workflow_call:
    inputs:
      merge-labels:
        description: マージ対象を絞るラベル (pascalgn/automerge-action の MERGE_LABELS。"!" 始まりは除外)
        type: string
        default: "!prototype"
      merge-method:
        description: merge | squash | rebase
        type: string
        default: "squash"
      delete-branch:
        description: マージ後に head ブランチを削除するか
        type: boolean
        default: true
    secrets:
      AGENT_GH_APP_ID:
        required: false
      AGENT_GH_APP_PRIVATE_KEY:
        required: false

jobs:
  auto-merge:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_AGENT_APP: ${{ secrets.AGENT_GH_APP_ID != '' && secrets.AGENT_GH_APP_PRIVATE_KEY != '' }}
    steps:
      # GITHUB_TOKEN でマージすると closing keyword による Issue の自動クローズも
      # 既定ブランチへの push を契機にした workflow も起きないため、App があればそのトークンでマージする。
      - name: Generate agent App token
        id: app
        if: env.HAS_AGENT_APP == 'true'
        uses: omni-stove/.github/actions/github-app-token@main
        with:
          app-id: ${{ secrets.AGENT_GH_APP_ID }}
          private-key: ${{ secrets.AGENT_GH_APP_PRIVATE_KEY }}

      - name: Auto merge
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          MERGE_LABELS: ${{ inputs.merge-labels }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          MERGE_DELETE_BRANCH: ${{ inputs.delete-branch }}
