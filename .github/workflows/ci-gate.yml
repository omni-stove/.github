name: CI Gate

# 呼び出し側の precheck.yml / ci.yml (Code Review) / lint / test などのジョブの結果を、単一の必須チェック
# "CI Gate" に集約し、finalize と自動修正の起動もこのジョブで行う reusable workflow。
# 必須チェックは "<この job 名> / CI Gate" になる。
# 呼び出し側の書き方は ci.yml のヘッダーを参照。
#
# - needs のどれかが failure / cancelled なら失敗する (skipped は失敗ではない)。hotfix / revert の
#   緊急避難口は ci-gate アクションが判定して素通しの success にする。
# - finalize は lint / test の結果とレビュー指摘から approve / request-changes を提出する。
# - run-fix なら同じ統合結果から自動修正 (agent-fix.yml) を起動する。lint / test が落ちていれば
#   trigger=ci、レビュー指摘があれば trigger=review。修正の push で CI が再実行され、その結果がまた戻る。

on:
  workflow_call:
    inputs:
      results:
        description: 集約するジョブの結果 (呼び出し側の `toJSON(needs)`)
        type: string
        required: true
      conflicted:
        description: precheck.yml の outputs.conflicted
        type: string
        default: "false"
      review-comments:
        description: ci.yml の outputs.review-comments
        type: string
        default: ""
      review-result:
        description: ci.yml の outputs.review-result
        type: string
        default: ""
      finalize:
        description: approve / request-changes を提出するか (ci.yml を run-review で呼んでいないときは false にする)
        type: boolean
        default: true
      run-fix:
        description: |
          lint / test の失敗とレビュー指摘をエージェントに直させ、PR に push するか (agent-fix.yml)。
          push で CI を再実行させるため AGENT_GH_APP_ID / AGENT_GH_APP_PRIVATE_KEY が要る (push はその App の
          トークンで行う)。失敗ログを読むため、呼び出し側の permissions に actions: read が要る
        type: boolean
        default: false
      fix-provider:
        description: 自動修正を実行するエージェント (claude | codex)
        type: string
        default: "claude"
      fix-tier:
        description: 自動修正のモデルの tier (max | high | medium | low)
        type: string
        default: "medium"
      fix-model:
        description: 自動修正のモデルを直接指定する (空なら fix-tier から解決する)
        type: string
        default: ""
      fix-allowed-bots:
        description: bot が起こした run でも自動修正を走らせる bot 名 (カンマ区切り。'*' で全て)
        type: string
        default: "*"
      fix-instructions:
        description: 修正指示に追記する文
        type: string
        default: ""
      fix-opt-out-path:
        description: レビュー指摘の自動修正を止めるユーザーを列挙したファイル (既定ブランチから読む)
        type: string
        default: ".github/autofix-opt-out.yml"
      regen-command:
        description: 自動修正が package.json 等を変えたときに lockfile / 生成物を作り直すコマンド
        type: string
        default: ""
      node-version:
        description: regen-command を動かす Node.js のバージョン
        type: string
        default: "24"
    secrets:
      REVIEWER_GH_APP_ID:
        required: false
      REVIEWER_GH_APP_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      AGENT_GH_APP_ID:
        required: false
      AGENT_GH_APP_PRIVATE_KEY:
        required: false

jobs:
  # CI Gate と finalize を別ジョブにすると、どちらも数秒で終わるのに 1 分ずつ課金されるため 1 ジョブにまとめる。
  # finalize 側のステップは continue-on-error にして、提出の失敗で必須チェックを落とさない。
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_REVIEWER_APP: ${{ secrets.REVIEWER_GH_APP_ID != '' && secrets.REVIEWER_GH_APP_PRIVATE_KEY != '' }}
      HAS_AGENT_APP: ${{ secrets.AGENT_GH_APP_ID != '' && secrets.AGENT_GH_APP_PRIVATE_KEY != '' }}
      # 緊急避難口 / コンフリクトの run では提出も修正もしない。
      FINALIZE: >-
        ${{ (inputs.finalize || inputs.run-fix)
        && github.event_name == 'pull_request'
        && inputs.conflicted != 'true'
        && !contains(github.event.pull_request.labels.*.name, 'hotfix')
        && !contains(github.event.pull_request.labels.*.name, 'revert')
        && !startsWith(github.head_ref, 'revert-') }}
    outputs:
      should-fix: ${{ steps.decide-fix.outputs.should-fix }}
      trigger: ${{ steps.decide-fix.outputs.trigger }}
      fix-review-comments: ${{ steps.decide-fix.outputs.fix-review-comments }}
    steps:
      - name: Collect job results
        id: results
        if: env.FINALIZE == 'true'
        continue-on-error: true
        env:
          RESULTS: ${{ inputs.results }}
        run: |
          set -euo pipefail
          # precheck.yml (outputs に proceed を持つ) と ci.yml (review-result を持つ) の呼び出しは lint / test ではないので外す。
          # 含めるとレビューが落ちただけの run を lint / test の失敗として自動修正してしまう。
          list=$(jq -r '[.[] | select((.outputs // {}) | has("proceed") or has("review-result") | not) | .result // empty] | join(" ")' <<<"$RESULTS")
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "job results: ${list}"

      - name: Generate reviewer App token
        id: reviewer-token
        if: env.FINALIZE == 'true' && steps.results.outcome == 'success' && inputs.finalize && env.HAS_REVIEWER_APP == 'true'
        continue-on-error: true
        uses: omni-stove/.github/actions/github-app-token@main
        with:
          app-id: ${{ secrets.REVIEWER_GH_APP_ID }}
          private-key: ${{ secrets.REVIEWER_GH_APP_PRIVATE_KEY }}

      - name: Finalize review
        id: finalize
        if: env.FINALIZE == 'true' && steps.results.outcome == 'success' && steps.reviewer-token.outcome != 'failure' && inputs.finalize
        continue-on-error: true
        uses: omni-stove/.github/actions/finalize-review@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
          lint-test-results: ${{ steps.results.outputs.list }}
          comments-json: ${{ inputs.review-comments }}
          review-result: ${{ inputs.review-result }}
          github-token: ${{ steps.reviewer-token.outputs.token || github.token }}
          reviewer-login: ${{ steps.reviewer-token.outputs.bot-login || 'github-actions[bot]' }}

      - name: Decide auto-fix
        id: decide-fix
        if: >-
          env.FINALIZE == 'true' && steps.results.outcome == 'success'
          && steps.reviewer-token.outcome != 'failure' && steps.finalize.outcome != 'failure'
          && inputs.run-fix
        continue-on-error: true
        uses: omni-stove/.github/actions/decide-fix@main
        with:
          lint-test-results: ${{ steps.results.outputs.list }}
          review-comment-count: ${{ steps.finalize.outputs.review-comment-count || '0' }}
          has-agent-app: ${{ env.HAS_AGENT_APP }}
          opt-out-path: ${{ inputs.fix-opt-out-path }}

      # 必須チェックの成否はこのステップだけで決まるよう最後に置く。
      - name: Gate on job results
        uses: omni-stove/.github/actions/ci-gate@main
        with:
          results: ${{ inputs.results }}

  # lint / test の失敗で ci-gate ジョブ自体は failure になるので、result ではなく should-fix だけを見る。
  fix:
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.should-fix == 'true' }}
    # permissions を書かず呼び出し側のものを引き継ぐ。actions: read を書くと、それを渡していない呼び出し側では
    # run-fix: false でも workflow の読み込み時に権限超過で落ちるため。
    uses: omni-stove/.github/.github/workflows/agent-fix.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.ref }}
      trigger: ${{ needs.ci-gate.outputs.trigger }}
      fix-review-comments: ${{ needs.ci-gate.outputs.fix-review-comments }}
      workflow-run-id: ${{ github.run_id }}
      provider: ${{ inputs.fix-provider }}
      tier: ${{ inputs.fix-tier }}
      model: ${{ inputs.fix-model }}
      allowed-bots: ${{ inputs.fix-allowed-bots }}
      instructions: ${{ inputs.fix-instructions }}
      regen-command: ${{ inputs.regen-command }}
      node-version: ${{ inputs.node-version }}
    secrets: inherit
